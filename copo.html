<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Rock na Praça | Produto </title>

    <link rel="icon" type="image/png" href="./assets/img/rock-na-praca_favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@300..800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./assets/CSS/estilo.css">
</head>

<body>

    <a href="./index.html#loja" class="produto-voltar">
        <span>⬅</span>
        <span>Voltar para a loja</span>
    </a>

    <main class="produto-container">


        <div class="produto-galeria">

            <input type="radio" name="galeria" id="img1" checked>
            <input type="radio" name="galeria" id="img2">
            <input type="radio" name="galeria" id="img3">

            <div class="produto-imagens">

                <img src="./assets/img/Copo_Rock-na-Praca.webp" class="foto foto1"
                    alt="Produto Copo Rock na Praça">

                <img src="./assets/img/Copo-frente_Rock-na-Praca.webp" class="foto foto2"
                    alt="Produto Copo Rock na Praça - Frente">

                <img src="./assets/img/Copo-costas_Rock-na-Praca.webp" class="foto foto3"
                    alt="Produto Copo Rock na Praça - Costas">

            </div>

            <div class="produto-miniaturas">

                <label for="img1">
                    <img src="./assets/img/Copo_Rock-na-Praca.webp" alt="Produto Copo Rock na Praça">
                </label>

                <label for="img2">
                    <img src="./assets/img/Copo-frente_Rock-na-Praca.webp"
                        alt="Produto Copo Rock na Praça - Frente">
                </label>

                <label for="img3">
                    <img src="./assets/img/Copo-costas_Rock-na-Praca.webp"
                        alt="Produto Copo Rock na Praça - Costas">
                </label>
            </div>
        </div>


        <div class="produto-info">

            <h1 id="nome">Copo</h1>
            <p id="descricao">
                Cor única, produzido em polipropileno 100% reciclável, ele é reutilizável, resistente e possui
                acabamento polido,
                Além disso, o copo é livre de IPE e produzido com certificação FSC, unindo estilo, praticidade e
                responsabilidade ambiental </p>
            <div id="preco" class="preco">R$10,00</div>

            <a href="./checkout.html" class="botao-adicionar">
                Adicionar ao carrinho
            </a>

        </div>

    </main>

</body>

</html>
